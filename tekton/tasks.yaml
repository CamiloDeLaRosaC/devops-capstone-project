apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: capstone-cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: clean
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: capstone-flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m venv /tmp/lint-env
        /tmp/lint-env/bin/pip install --no-cache-dir flake8==4.0.1
        /tmp/lint-env/bin/flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: capstone-nosetests
spec:
  workspaces:
    - name: source
  steps:
    - name: tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: sqlite:////tmp/accounts-tests.db
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
      script: |
        #!/bin/sh
        set -eu
        python -m venv /tmp/test-env
        /tmp/test-env/bin/pip install --no-cache-dir -r requirements.txt
        printf '[nosetests]\nverbosity=2\n' > /tmp/nose.cfg
        /tmp/test-env/bin/nosetests --config=/tmp/nose.cfg -v --with-coverage --cover-package=service
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: capstone-build
spec:
  workspaces:
    - name: source
  steps:
    - name: build-image
      image: quay.io/openshift/origin-cli:4.14
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        oc start-build accounts --from-dir=. --follow
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: capstone-deploy
spec:
  workspaces:
    - name: source
  steps:
    - name: deploy-accounts
      image: quay.io/openshift/origin-cli:4.14
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        oc apply -f deploy/deployment.yaml -f deploy/service.yaml
        oc rollout restart deployment/accounts
        oc rollout status deployment/accounts --timeout=180s
        oc get deployment,pods,replicasets,services -l app=accounts
