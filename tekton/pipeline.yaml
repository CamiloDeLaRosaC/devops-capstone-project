apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: capstone-cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
      type: string
      default: https://github.com/CamiloDeLaRosaC/devops-capstone-project.git
    - name: branch
      type: string
      default: main
  tasks:
    - name: cleanup
      taskRef:
        name: capstone-cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: clone
      runAfter: [cleanup]
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
      workspaces:
        - name: output
          workspace: pipeline-workspace
    - name: lint
      runAfter: [clone]
      taskRef:
        name: capstone-flake8
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: tests
      runAfter: [lint]
      taskRef:
        name: capstone-nosetests
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: build
      runAfter: [tests]
      taskRef:
        name: capstone-build
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: deploy
      runAfter: [build]
      taskRef:
        name: capstone-deploy
      workspaces:
        - name: source
          workspace: pipeline-workspace
